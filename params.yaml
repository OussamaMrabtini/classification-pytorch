train:
  batch_size: 16
  max_epochs: 5
  learning_rate: 0.00001
  freeze_backbone: false
  patience: 10
  k_folds: 5

model:
  backbone: resnet18
  num_classes: 2
  class_names: ['cat', 'dog']

data:
  data_path: ./data/
  train_ratio: 0.8
  val_ratio: 0.1
  test_ratio: 0.1

paths:
  model_dir: ./models/
  plots_dir: ./plots/
  metrics_dir: ./metrics/

mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: binary-classification

dvc:
  remote: gdrive_remote
  enabled: true